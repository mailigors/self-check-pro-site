name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Сборка статического сайта
        run: bash scripts/prepare-pages.sh

      - name: Загрузка артефакта
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

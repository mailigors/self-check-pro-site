name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка сайта
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка системных зависимостей
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils ripgrep

      - name: Запуск проверок
        run: bash scripts/check-site.sh

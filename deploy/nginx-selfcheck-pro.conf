limit_req_zone $binary_remote_addr zone=selfcheck_leads:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name selfcheck.pro www.selfcheck.pro;

    root /var/www/selfcheck-deployments/current/dist;
    index index.html;
    client_max_body_size 8k;

    location = /api/lead {
        limit_req zone=selfcheck_leads burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
